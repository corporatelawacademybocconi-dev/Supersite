{% extends "admin/base_admin.html" %}

{% block title %}Add Person{% endblock %}

{% block admin_content %}

<section class="page-hero">
    <div class="page-hero-inner">
        <p class="page-hero-label">Reserved Area</p>
        <h1 class="page-hero-title">Add Person</h1>
    </div>
</section>

<section class="section">
    <div class="container">

        <form method="POST" class="reserved-login-form" enctype="multipart/form-data">

            <input type="text" name="name" placeholder="Full name" required>

            <input type="text" name="slug" placeholder="Slug, e.g. mario-rossi">

            <input type="text" name="role" placeholder="Role">

            <input type="text" name="term_year" placeholder="Term year, e.g. 2024–2025">

            <textarea name="bio" rows="6" placeholder="Biography"></textarea>

            <input type="url" name="linkedin_url" placeholder="LinkedIn URL">

            <label>
                <input type="checkbox" name="is_author">
                Author
            </label>

            <label>
                <input type="checkbox" name="is_team_member">
                Team Member
            </label>

            <label for="division">Division</label>

            <select name="division" id="division">
                <option value="">None</option>
                <option value="leadership">Leadership</option>
                <option value="heads">Heads</option>
                <option value="past_president">Past President</option>
            </select>

            <label for="profile_image_url">
                Profile Picture URL
            </label>

            <input type="url" id="profile_image_url" name="profile_image_url" placeholder="https://...">

            <label for="profile_image">
                Upload Profile Picture
            </label>

            <input type="file" id="profile_image" name="profile_image" accept="image/*">

            <button type="submit" class="btn btn-primary">
                Add Person
            </button>

        </form>

    </div>
</section>

{% endblock %}
