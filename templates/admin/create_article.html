{% extends "admin/base_admin.html" %}

{% block title %}Create Article{% endblock %}

{% block admin_content %}

<section class="page-hero">
    <div class="page-hero-inner">
        <p class="page-hero-label">Reserved Area</p>
        <h1 class="page-hero-title">Create Article</h1>
    </div>
</section>

<section class="section">
    <div class="container">

        <form method="POST" enctype="multipart/form-data" class="reserved-login-form">

            <input type="text" name="title" placeholder="Title" required>

            <label for="author-search">Authors</label>

            <input type="search" id="author-search" placeholder="Search authors..." autocomplete="off">

            <div id="author-options" style="
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 18px;
        max-height: 240px;
        overflow-y: auto;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid rgba(181, 169, 154, 0.45);
    ">
                {% for author in authors %}
                <label class="author-option" data-author-name="{{ author.name | lower }}" style="
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        ">
                    <input type="checkbox" name="author_ids" value="{{ author.id }}">
                    <span>{{ author.name }}</span>
                </label>
                {% endfor %}
            </div>

            <label>Tags</label>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;">
                {% for tag in all_tags %}
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" name="tag_ids" value="{{ tag.id }}">
                    {{ tag.name }}
                </label>
                {% endfor %}
            </div>

            <textarea name="excerpt" rows="3" placeholder="Excerpt"></textarea>

            <!-- TinyMCE replaces this textarea -->
            <textarea id="content-editor" name="content" placeholder="Article Content"></textarea>

            <select name="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
            </select>
            <label>Publication date</label>
            <input type="date" name="published_at">

            <label>Cover Image URL</label>
            <input type="url" name="cover_image_url"
                placeholder="https://your-project.supabase.co/storage/v1/object/public/media/...">

            <label>Upload Cover Image</label>
            <input type="file" name="cover_image" accept="image/*">

            <label>Upload article PDF</label>
            <input type="file" name="article_pdf" accept="application/pdf,.pdf">

            <label>
                <input type="checkbox" name="is_featured">
                Featured Article
            </label>

            <button type="submit" class="btn btn-primary">Create Article</button>

        </form>

    </div>
</section>

<!-- Replace YOUR_API_KEY with your key from tiny.cloud -->
<script src="https://cdn.tiny.cloud/1/28no8almk00il0r0u1zzfpt4ere74sj6ntgzg7efe78phbrk/tinymce/7/tinymce.min.js"
    referrerpolicy="origin"></script>

<script>
    tinymce.init({
        selector: '#content-editor',
        plugins: 'lists link',
        toolbar: 'bold italic underline | h2 h3 | bullist numlist | link blockquote | removeformat',
        menubar: false,
        branding: false,
        height: 500,
        content_style: 'body { font-family: Georgia, serif; font-size: 17px; line-height: 1.8; max-width: 720px; margin: 0 auto; }',
    });
</script>
<script>
    const authorSearch = document.getElementById("author-search");
    const authorOptions = document.querySelectorAll(".author-option");

    authorSearch.addEventListener("input", function () {
        const searchTerm = this.value.trim().toLowerCase();

        authorOptions.forEach(function (option) {
            const authorName = option.dataset.authorName;

            option.style.display = authorName.includes(searchTerm)
                ? "flex"
                : "none";
        });
    });
</script>

{% endblock %}
